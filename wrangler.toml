name = "gold-miner-3d"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# Cloudflare Pages Configuration
# Để liên kết custom domain của bạn (ví dụ: daovang3d.com hoặc game.yourdomain.com):
# 1. Chạy lệnh: npx wrangler pages project create gold-miner-3d (hoặc tạo trên Cloudflare Dashboard)
# 2. Deploy bằng lệnh: npm run deploy
# 3. Vào Cloudflare Dashboard -> Workers & Pages -> gold-miner-3d -> Custom Domains -> Set up a custom domain
